name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'infrastructure/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/ci-cd.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'infrastructure/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.6.0
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with pytest (parallel)
        run: |
          pytest tests/ -v --tb=short -n auto --cov=src --cov-branch --cov-report=xml --cov-report=term-missing --junitxml=junit.xml -o junit_family=legacy
        continue-on-error: false

      - name: Run integration tests
        run: |
          python tests/test_local.py
        continue-on-error: false

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests completed" >> $GITHUB_STEP_SUMMARY

  plan:
    name: Terraform Plan (PR Review)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write # For commenting on PR with plan output
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # rearc-data-pipeline IAM user (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY in repo secrets)
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (Dev Environment)
        working-directory: infrastructure/terraform
        run: |
          terraform init \
            -backend-config="key=rearc-data-pipeline/dev/terraform.tfstate" \
            -reconfigure

      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform Plan (Dev)
        id: plan
        working-directory: infrastructure/terraform
        run: terraform plan -var-file="environments.dev.tfvars" -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const planPath = path.join(process.cwd(), 'infrastructure/terraform/plan.txt');
            const planOutput = fs.existsSync(planPath) ? fs.readFileSync(planPath, 'utf8') : '(plan output not found)';
            const output = `#### Terraform Plan 📖
            \`\`\`\n${planOutput}\n\`\`\`
            *Action: Plan run on PR by @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: dev
    # Auto-deploy to dev on push to main/master, or manual workflow_dispatch with environment=dev
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    permissions:
      contents: write   # For checkout and git push of outputs.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # rearc-data-pipeline IAM user (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY in repo secrets)
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Tests Before Deploy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests/ -v --tb=short -n auto --cov=src --cov-branch --cov-report=xml --cov-report=term-missing --junitxml=junit.xml -o junit_family=legacy
          python tests/test_local.py

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Update Lambda Dependencies
        run: |
          echo "=== Updating Lambda Dependencies ==="
          
          # Data Sync Lambda
          cd infrastructure/lambda/data_sync
          rm -rf boto3 botocore requests *.dist-info __pycache__ bin rearc 2>/dev/null || true
          pip install -r requirements.txt -t . --quiet
          mkdir -p rearc
          cp -r ../../../src/rearc/* rearc/
          
          # Analytics Lambda
          cd ../analytics
          rm -rf boto3 botocore pandas numpy pytz tzdata dateutil jmespath s3transfer urllib3 rearc *.dist-info __pycache__ bin 2>/dev/null || true
          pip install --platform manylinux2014_x86_64 --target . --implementation cp --python-version 3.11 --only-binary=:all: --no-cache-dir boto3 --quiet
          pip install --platform manylinux2014_x86_64 --target . --implementation cp --python-version 3.11 --only-binary=:all: --no-cache-dir "numpy<2.0" --quiet
          pip install --platform manylinux2014_x86_64 --target . --implementation cp --python-version 3.11 --only-binary=:all: --no-cache-dir pandas --quiet
          mkdir -p rearc
          cp -r ../../../src/rearc/* rearc/

      - name: Terraform Init (Dev)
        working-directory: infrastructure/terraform
        run: |
          terraform init \
            -backend-config="key=rearc-data-pipeline/dev/terraform.tfstate" \
            -reconfigure

      - name: Terraform Plan (Dev)
        working-directory: infrastructure/terraform
        run: terraform plan -var-file="environments.dev.tfvars" -out=tfplan

      - name: Terraform Apply (Dev)
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Refresh Outputs
        run: |
          cd infrastructure/terraform
          terraform output -json | python3 ../../scripts/terraform_outputs_to_json.py -o ../../config/outputs.json -e dev

      - name: Commit and push outputs.json
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase || true
          git add config/outputs.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update infrastructure outputs [skip ci]"
            git push
          else
            echo "No changes to outputs.json"
          fi

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: prod
    # Prod deployments are manual via workflow_dispatch only when environment=prod
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    permissions:
      contents: write   # For checkout and git push of outputs-prod.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # rearc-data-pipeline IAM user (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY in repo secrets)
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Tests Before Deploy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests/ -v --tb=short -n auto --cov=src --cov-branch --cov-report=xml --cov-report=term-missing --junitxml=junit.xml -o junit_family=legacy
          python tests/test_local.py

      - name: Update Lambda Dependencies
        run: |
          echo "=== Updating Lambda Dependencies for Prod ==="
          
          # Data Sync Lambda
          cd infrastructure/lambda/data_sync
          rm -rf boto3 botocore requests *.dist-info __pycache__ bin rearc 2>/dev/null || true
          pip install -r requirements.txt -t . --quiet
          mkdir -p rearc
          cp -r ../../../src/rearc/* rearc/
          
          # Analytics Lambda
          cd ../analytics
          rm -rf boto3 botocore pandas numpy pytz tzdata dateutil jmespath s3transfer urllib3 rearc *.dist-info __pycache__ bin 2>/dev/null || true
          pip install --platform manylinux2014_x86_64 --target . --implementation cp --python-version 3.11 --only-binary=:all: --no-cache-dir boto3 --quiet
          pip install --platform manylinux2014_x86_64 --target . --implementation cp --python-version 3.11 --only-binary=:all: --no-cache-dir "numpy<2.0" --quiet
          pip install --platform manylinux2014_x86_64 --target . --implementation cp --python-version 3.11 --only-binary=:all: --no-cache-dir pandas --quiet
          mkdir -p rearc
          cp -r ../../../src/rearc/* rearc/

      - name: Terraform Init (Prod)
        working-directory: infrastructure/terraform
        run: |
          terraform init \
            -backend-config="key=rearc-data-pipeline/prod/terraform.tfstate" \
            -reconfigure

      - name: Terraform Plan (Prod)
        working-directory: infrastructure/terraform
        run: terraform plan -var-file="environments.prod.tfvars" -out=tfplan

      - name: Terraform Apply (Prod)
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Refresh Outputs (Prod)
        run: |
          cd infrastructure/terraform
          terraform output -json | python3 ../../scripts/terraform_outputs_to_json.py -o ../../config/outputs-prod.json -e prod

      - name: Commit and push outputs-prod.json
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase || true
          git add config/outputs-prod.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update prod infrastructure outputs [skip ci]"
            git push
          fi
